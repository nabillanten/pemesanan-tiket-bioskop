<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Pemesanan Jadwal Tiket Bioskop</title>
    <style>
      :root {
        --primary: #2563eb;
        --secondary: #8b5cf6;
        --success: #10b981;
        --danger: #ef4444;
        --bg: #f3f4f6;
        --card-bg: #ffffff;
        --text: #1f2937;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        color: var(--primary);
        margin-bottom: 30px;
      }

      .dashboard {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 20px;
      }

      @media (max-width: 900px) {
        .dashboard { grid-template-columns: 1fr; }
      }

      .panel {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        height: fit-content;
        display: flex;
        flex-direction: column;
      }

      .panel h2 {
        margin-top: 0;
        border-bottom: 2px solid var(--bg);
        padding-bottom: 10px;
        font-size: 1.2rem;
      }

      .form-group { margin-bottom: 15px; }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
        font-size: 0.9rem;
      }
      .form-group input, .form-group select {
        width: 100%;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 5px;
        box-sizing: border-box;
      }

      .search-box {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 20px;
        box-sizing: border-box;
        margin-bottom: 10px;
        margin-top: 20px;
        background-color: #f9fafb;
        font-size: 0.9rem;
        outline: none;
        text-align: center;
        transition: 0.3s;
      }
      .search-box:focus {
        background-color: #fff;
        border-color: var(--primary);
        box-shadow: 0 0 5px rgba(37, 99, 235, 0.2);
      }

      button {
        width: 100%;
        padding: 10px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
      }
      button:hover { background-color: #1d4ed8; }
      .btn-add-penonton { background-color: var(--secondary); }
      .btn-add-penonton:hover { background-color: #7c3aed; }
      .btn-add-relasi { background-color: var(--success); }
      .btn-add-relasi:hover { background-color: #059669; }
      button.btn-delete {
        background-color: var(--danger);
        margin-top: 5px;
        font-size: 0.8rem;
        padding: 5px;
      }

      .list-container {
        margin-top: 10px;
        max-height: 500px;
        overflow-y: auto;
        flex-grow: 1;
      }

      .card {
        background: #f9fafb;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 6px;
        position: relative;
        border-left: 5px solid #ccc;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }
      .card-film { border-left-color: var(--primary); }
      .card-penonton { border-left-color: var(--secondary); }
      .card-relasi { border-left-color: var(--success); background: #f0fdf4; }

      .card-header { display: flex; justify-content: space-between; align-items: start; }
      .card-title { font-weight: bold; font-size: 1.05rem; }
      .card-sub { font-size: 0.85rem; color: #6b7280; margin: 2px 0px; }
      
      .badge-list { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
      .badge {
        background: #dbeafe; color: #1e40af; padding: 3px 8px;
        border-radius: 12px; font-size: 0.75rem; display: flex; align-items: center; gap: 5px;
      }
      
      /* Badge khusus history penonton (Warna Ungu) */
      .badge-history {
        background: #f3e8ff; color: #6b21a8;
      }

      .badge-delete {
        cursor: pointer; font-weight: bold; margin-left: 5px; color: inherit; opacity: 0.6;
      }
      .badge-delete:hover { opacity: 1; color: var(--danger); }

      .empty-state {
        text-align: center; padding: 30px 10px; color: #9ca3af;
        background-color: #f9fafb; border-radius: 8px; border: 2px dashed #e5e7eb; margin-top: 10px;
      }
      .empty-icon { font-size: 2rem; margin-bottom: 5px; display: block; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Sistem Pemesanan Jadwal Tiket Bioskop</h1>

      <div class="dashboard">
        <div class="panel">
          <h2>Film</h2>
          <div class="form-group">
            <label>Judul Film</label>
            <input type="text" id="inputJudul" placeholder="Contoh: Spider-Man" />
          </div>
          <div class="form-group">
            <label>Tanggal Tayang</label>
            <input type="date" id="inputTanggal" />
          </div>
          <div class="form-group">
            <label>Studio & Jam</label>
            <input type="text" id="inputStudio" placeholder="Studio 1 - 19:00" />
          </div>
          <button onclick="uiAddFilm()">Tambah Film</button>

          <input type="search" id="searchFilm" class="search-box" placeholder="🔍 Cari Film..." oninput="renderUI()" />
          <div id="listFilm" class="list-container"></div>
        </div>

        <div class="panel">
          <h2>Penonton</h2>
          <div class="form-group">
            <label>Nama Penonton</label>
            <input type="text" id="inputNama" placeholder="Nama Lengkap" />
          </div>
          <div class="form-group">
            <label>No. Handphone</label>
            <input type="text" id="inputHP" placeholder="08xxx" />
          </div>
          <button class="btn-add-penonton" onclick="uiAddPenonton()">Tambah Penonton</button>

          <input type="search" id="searchPenonton" class="search-box" placeholder="🔍 Cari Penonton..." oninput="renderUI()" />
          <div id="listPenonton" class="list-container"></div>
        </div>

        <div class="panel">
          <h2>Tiket</h2>
          <div class="form-group">
            <label>Pilih Film</label>
            <select id="selectFilm"><option value="">-- Pilih Film --</option></select>
          </div>
          <div class="form-group">
            <label>Pilih Penonton</label>
            <select id="selectPenonton"><option value="">-- Pilih Penonton --</option></select>
          </div>
          <button class="btn-add-relasi" onclick="uiAddRelasi()">Beli Tiket</button>

          <input type="search" id="searchRelasi" class="search-box" style="border-color: var(--success);" placeholder="🔍 Cari Tiket..." oninput="renderUI()" />
          <div id="listRelasi" class="list-container"></div>
        </div>
      </div>
    </div>

    <script>
      // =========================================
      // 1. DATA STRUCTURE
      // =========================================
      class RelationNode {
        constructor(penonton) {
          this.penonton = penonton; 
          this.next = null; 
        }
      }

      class FilmNode {
        constructor(id, judul, tanggal, studio) {
          this.id = id;
          this.judul = judul;
          this.tanggal = tanggal;
          this.studio = studio;
          this.next = null; 
          this.prev = null; 
          this.relasiHead = null; 
        }
      }

      class PenontonNode {
        constructor(id, nama, hp) {
          this.id = id;
          this.nama = nama;
          this.hp = hp;
          this.next = null; 
        }
      }

      let headFilm = null;
      let tailFilm = null;
      let headPenonton = null;
      let filmCounter = 1;
      let penontonCounter = 1;

      // =========================================
      // 2. LOGIC FUNCTIONS
      // =========================================

      function addFilm(judul, tanggal, studio) {
        const id = "F" + String(filmCounter++).padStart(3, "0");
        const newNode = new FilmNode(id, judul, tanggal, studio);
        if (!headFilm) {
          headFilm = newNode;
          tailFilm = newNode;
        } else {
          tailFilm.next = newNode;
          newNode.prev = tailFilm;
          tailFilm = newNode;
        }
        return newNode;
      }

      function addPenonton(nama, hp) {
        const id = "C" + String(penontonCounter++).padStart(3, "0");
        const newNode = new PenontonNode(id, nama, hp);
        if (!headPenonton) {
          headPenonton = newNode;
        } else {
          let temp = headPenonton;
          while (temp.next) temp = temp.next;
          temp.next = newNode;
        }
        return newNode;
      }

      function addRelasi(filmObj, penontonObj) {
        let check = filmObj.relasiHead;
        while (check) {
          if (check.penonton === penontonObj) {
            alert("Tiket sudah ada!");
            return;
          }
          check = check.next;
        }
        const newRel = new RelationNode(penontonObj);
        if (!filmObj.relasiHead) {
          filmObj.relasiHead = newRel;
        } else {
          let temp = filmObj.relasiHead;
          while (temp.next) temp = temp.next;
          temp.next = newRel;
        }
      }

      function deleteFilm(idFilm) {
        let curr = headFilm;
        while (curr) {
          if (curr.id === idFilm) {
            if (curr === headFilm) {
              headFilm = curr.next;
              if (headFilm) headFilm.prev = null; else tailFilm = null;
            } else if (curr === tailFilm) {
              tailFilm = curr.prev; tailFilm.next = null;
            } else {
              curr.prev.next = curr.next; curr.next.prev = curr.prev;
            }
            return;
          }
          curr = curr.next;
        }
      }

      function deletePenonton(idPenonton) {
        let f = headFilm;
        while (f) {
          let r = f.relasiHead; let prevR = null;
          while (r) {
            if (r.penonton.id === idPenonton) {
              if (!prevR) f.relasiHead = r.next; else prevR.next = r.next;
            }
            prevR = r; r = r.next;
          }
          f = f.next;
        }
        let curr = headPenonton; let prev = null;
        while (curr) {
          if (curr.id === idPenonton) {
            if (!prev) headPenonton = curr.next; else prev.next = curr.next;
            return;
          }
          prev = curr; curr = curr.next;
        }
      }

      function deleteRelasi(idFilm, idPenonton) {
        let f = headFilm;
        while (f && f.id !== idFilm) f = f.next;
        if (f) {
          let r = f.relasiHead; let prevR = null;
          while (r) {
            if (r.penonton.id === idPenonton) {
              if (!prevR) f.relasiHead = r.next; else prevR.next = r.next;
              renderUI(); return;
            }
            prevR = r; r = r.next;
          }
        }
      }

      // =========================================
      // 3. UI FUNCTIONS
      // =========================================

      function uiAddFilm() {
        const judul = document.getElementById("inputJudul").value;
        const tanggal = document.getElementById("inputTanggal").value;
        const studio = document.getElementById("inputStudio").value;

        if (!judul || !tanggal || !studio) return alert("Isi lengkap semua data film!");
        
        addFilm(judul, tanggal, studio);
        
        document.getElementById("inputJudul").value = "";
        document.getElementById("inputTanggal").value = "";
        document.getElementById("inputStudio").value = "";
        renderUI();
      }

      function uiAddPenonton() {
        const nama = document.getElementById("inputNama").value;
        const hp = document.getElementById("inputHP").value;
        if (!nama || !hp) return alert("Isi lengkap!");
        addPenonton(nama, hp);
        document.getElementById("inputNama").value = "";
        document.getElementById("inputHP").value = "";
        renderUI();
      }

      function uiAddRelasi() {
        const idFilm = document.getElementById("selectFilm").value;
        const idPenonton = document.getElementById("selectPenonton").value;
        if (!idFilm || !idPenonton) return alert("Pilih keduanya!");

        let fObj = null; let currF = headFilm;
        while (currF) { if (currF.id === idFilm) fObj = currF; currF = currF.next; }

        let pObj = null; let currP = headPenonton;
        while (currP) { if (currP.id === idPenonton) pObj = currP; currP = currP.next; }

        if (fObj && pObj) {
          addRelasi(fObj, pObj);
          renderUI();
        }
      }

      function renderUI() {
        const listFilmDiv = document.getElementById("listFilm");
        const listPenontonDiv = document.getElementById("listPenonton");
        const listRelasiDiv = document.getElementById("listRelasi");
        const selectFilm = document.getElementById("selectFilm");
        const selectPenonton = document.getElementById("selectPenonton");

        const sFilm = document.getElementById("searchFilm").value.toLowerCase();
        const sPenonton = document.getElementById("searchPenonton").value.toLowerCase();
        const sRelasi = document.getElementById("searchRelasi").value.toLowerCase();

        listFilmDiv.innerHTML = ""; listPenontonDiv.innerHTML = ""; listRelasiDiv.innerHTML = "";
        selectFilm.innerHTML = '<option value="">-- Pilih Film --</option>';
        selectPenonton.innerHTML = '<option value="">-- Pilih Penonton --</option>';

        // --- RENDER FILM ---
        let f = headFilm; let anyFilm = false;
        while (f) {
          let opt = document.createElement("option"); opt.value = f.id; opt.innerText = f.judul; selectFilm.appendChild(opt);

          if (f.judul.toLowerCase().includes(sFilm) || f.id.toLowerCase().includes(sFilm)) {
            anyFilm = true;
            let card = document.createElement("div"); card.className = "card card-film";
            let r = f.relasiHead; let count = 0;
            let badgeHTML = '<div class="badge-list">';
            while(r){ 
                badgeHTML += `
                    <span class="badge">
                        ${r.penonton.nama}
                        <span class="badge-delete" onclick="deleteRelasi('${f.id}', '${r.penonton.id}')">&times;</span>
                    </span>`; 
                count++; r=r.next; 
            }
            badgeHTML += '</div>';

            card.innerHTML = `
              <div class="card-header">
                <div>
                  <div class="card-title">${f.judul}</div>
                  <div class="card-sub">📅 ${f.tanggal}</div>
                  <div class="card-sub">📍 ${f.studio}</div>
                  <div class="card-sub" style="font-size:0.75rem; color:#aaa;">ID: ${f.id}</div>
                </div>
                <div style="font-weight:bold; color:var(--primary);">${count} Tiket</div>
              </div>
              <hr style="border:0; border-top:1px solid #e5e7eb; margin:5px 0;">
              <div style="font-size:0.75rem; color:#666;">Daftar Penonton:</div>
              ${count>0 ? badgeHTML : '<small style="color:#999">Belum ada penonton</small>'}
              <button class="btn-delete" onclick="if(confirm('Hapus Film?')) { deleteFilm('${f.id}'); renderUI(); }">Hapus</button>
            `;
            listFilmDiv.appendChild(card);
          }
          f = f.next;
        }
        if(!anyFilm) listFilmDiv.innerHTML = `<div class="empty-state"><span class="empty-icon">🎬</span>Film kosong</div>`;

        // --- RENDER PENONTON (UPDATED WITH HISTORY!) ---
        let p = headPenonton; let anyPenonton = false;
        while (p) {
          let opt = document.createElement("option"); opt.value = p.id; opt.innerText = p.nama; selectPenonton.appendChild(opt);
          if (p.nama.toLowerCase().includes(sPenonton) || p.id.toLowerCase().includes(sPenonton)) {
            anyPenonton = true;
            let card = document.createElement("div"); card.className = "card card-penonton";
            
            // --- LOGIC: CARI HISTORY FILM ---
            let historyHTML = '<div class="badge-list">';
            let tempF = headFilm;
            let historyCount = 0;
            while(tempF) {
                let tempR = tempF.relasiHead;
                while(tempR) {
                    if(tempR.penonton.id === p.id) {
                        historyHTML += `
                            <span class="badge badge-history">
                                🎬 ${tempF.judul}
                                <span class="badge-delete" onclick="deleteRelasi('${tempF.id}', '${p.id}')">&times;</span>
                            </span>`;
                        historyCount++;
                    }
                    tempR = tempR.next;
                }
                tempF = tempF.next;
            }
            historyHTML += '</div>';
            // --------------------------------

            card.innerHTML = `
              <div class="card-header">
                <div>
                  <div class="card-title">${p.nama}</div>
                  <div class="card-sub">📞 ${p.hp}</div>
                  <div class="card-sub" style="font-size:0.75rem; color:#aaa;">ID: ${p.id}</div>
                </div>
              </div>
              <hr style="border:0; border-top:1px solid #e5e7eb; margin:5px 0;">
              <div style="font-size:0.75rem; color:#666;">Film yang ditonton:</div>
              ${historyCount > 0 ? historyHTML : '<small style="color:#999">Belum menonton apapun</small>'}
              
              <button class="btn-delete" onclick="if(confirm('Hapus Penonton?')) { deletePenonton('${p.id}'); renderUI(); }">Hapus</button>
            `;
            listPenontonDiv.appendChild(card);
          }
          p = p.next;
        }
        if(!anyPenonton) listPenontonDiv.innerHTML = `<div class="empty-state"><span class="empty-icon">👤</span>Penonton kosong</div>`;

        // --- RENDER RELASI ---
        let f2 = headFilm; let anyRelasi = false;
        while(f2) {
            let r2 = f2.relasiHead;
            while(r2) {
                let textMatch = f2.judul.toLowerCase().includes(sRelasi) || r2.penonton.nama.toLowerCase().includes(sRelasi);
                if(textMatch) {
                    anyRelasi = true;
                    let card = document.createElement("div"); card.className = "card card-relasi";
                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <div class="card-title">🎫 ${f2.judul}</div>
                                <div class="card-sub" style="color:var(--text)">Penonton: <strong>${r2.penonton.nama}</strong></div>
                                <div class="card-sub">${f2.tanggal} | ${f2.studio}</div>
                            </div>
                            <button class="btn-delete" style="width:auto; padding:5px 10px;" 
                                onclick="deleteRelasi('${f2.id}', '${r2.penonton.id}')"> &times; Batal </button>
                        </div>
                    `;
                    listRelasiDiv.appendChild(card);
                }
                r2 = r2.next;
            }
            f2 = f2.next;
        }
        if(!anyRelasi) listRelasiDiv.innerHTML = `<div class="empty-state"><span class="empty-icon">🎫</span>Tiket kosong</div>`;
      }

      // Init Data Dummy
      addFilm("Avengers", "2025-12-20", "Studio 1 - 15:00");
      addFilm("Harry Potter", "2025-12-21", "Studio 2 - 19:00");
      addPenonton("Nabil", "08123");
      addPenonton("Budi", "08456");
      addRelasi(headFilm, headPenonton); // Nabil nonton Avengers
      addRelasi(headFilm.next, headPenonton); // Nabil nonton Harry Potter juga

      renderUI();
    </script>
  </body>
</html>
